<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>pi861 Console</title>
	<link rel="stylesheet" href="/styles.css" />
</head>
<body>
	<div id="unlock" class="unlock hidden">
		<form id="unlock-form" class="unlock-card">
			<h2>pi861 Console</h2>
			<p>Enter the console token (PI861_CONSOLE_TOKEN).</p>
			<input id="unlock-token" type="password" placeholder="Bearer token" autocomplete="off" />
			<button type="submit">Unlock</button>
			<p id="unlock-error" class="error hidden"></p>
		</form>
	</div>
	<div class="shell">
		<nav class="sidebar">
			<div class="brand"><span class="brand-mark">861</span></div>
			<a href="#/chat" data-nav="chat" title="Chat"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z"/></svg><span>Chat</span></a>
			<a href="#/goals" data-nav="goals" title="Goals"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M21 12a9 9 0 1 1-6-8.5"/></svg><span>Goals</span></a>
			<a href="#/agents" data-nav="agents" title="Agents"><svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zm4 9a8 8 0 1 0-16 0"/></svg><span>Agents</span></a>
			<a href="#/models" data-nav="models" title="Models"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5zm0 5L7 9.5v5L12 17l5-2.5v-5L12 7z"/></svg><span>Models</span></a>
			<a href="#/settings" data-nav="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a>
			<div class="sidebar-footer"><span id="conn-pill" class="pill offline">offline</span></div>
		</nav>
		<div class="main">
			<header class="topbar">
				<span class="topbar-title" id="page-title">Chat</span>
				<span class="topbar-project" id="top-project"></span>
				<span class="topbar-goal" id="top-goal"></span>
				<span class="spacer"></span>
				<span id="readonly-pill" class="pill warn hidden">read-only</span>
				<span id="runner-pill" class="pill idle">runner: –</span>
			</header>
			<main id="content" class="content"></main>
		</div>
	</div>
	<div id="toasts" class="toasts"></div>
	<script type="module" src="/main.js"></script>
</body>
</html>
